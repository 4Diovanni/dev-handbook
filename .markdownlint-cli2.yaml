config:
  default: true
  MD013: false          # line length: prose is wrapped by editors
  MD024:
    siblings_only: true # same heading text allowed in different sections
  MD033: false          # inline HTML allowed for badges and details
  MD041: true
ignores:
  - "node_modules/**"
  - "site/**"
  - "LICENSE*"
  - "CHANGELOG.md"
  - ".github/PULL_REQUEST_TEMPLATE.md"
